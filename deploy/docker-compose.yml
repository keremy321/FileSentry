name: filesentry

services:
  postgresql:
    image: postgres:17
    container_name: filesentry-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4_base
    container_name: filesentry-clamav
    environment:
      CLAMD_STARTUP_TIMEOUT: 180
    ports:
      # Temporary while the API runs on the host. Remove this mapping once the API is containerized.
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav-signatures:/var/lib/clamav
    restart: unless-stopped

volumes:
  postgres-data:
  clamav-signatures:
